{{define "content"}}
<a class="back" href="/admin">{{t .Lang "back_all"}}</a>
{{with fetchnote .Lang .Item.Fetch}}<div class="flash warn">{{.}}</div>{{else}}{{if .Item.FetchNote}}<div class="flash warn">{{.Item.FetchNote}}</div>{{end}}{{end}}
<section class="panel edit">
  <div class="preview">
    {{if .Item.Image}}<img src="/img/{{.Item.Image}}" alt="">{{else}}<span class="noimg">🎁</span>{{end}}
  </div>
  <form method="post" action="/admin/items/{{.Item.ID}}" class="form">
    <label>{{t .Lang "f_url"}}<input type="url" name="url" value="{{.Item.URL}}" required></label>
    <label>{{t .Lang "f_title"}}<input name="title" value="{{.Item.Title}}" maxlength="300"></label>
    <label>{{t .Lang "f_image"}}
      <input type="url" name="image_src" value="{{.Item.ImageSrc}}">
      <small class="hint">{{t .Lang "f_image_hint"}}</small>
    </label>
    <div class="row">
      <label>{{t .Lang "f_price"}}<input name="price" value="{{.Item.Price}}" inputmode="decimal" maxlength="32">
        <small class="hint">{{if .Item.Unavailable}}{{t .Lang "f_unavailable"}} {{end}}{{if .Item.PriceCheckedAt}}{{tf .Lang "f_price_checked" (datetime .Lang .Item.PriceCheckedAt)}}{{else}}{{t .Lang "f_price_never"}}{{end}}</small></label>
      <label>{{t .Lang "f_currency"}}<input name="currency" value="{{.Item.Currency}}" maxlength="3" placeholder="USD"></label>
      <label>{{t .Lang "f_quantity"}}<input type="number" name="quantity" min="1" max="99" value="{{.Item.Quantity}}"></label>
    </div>
    <div class="row">
      <label>{{t .Lang "f_region"}}
        <select name="region">
          <option value=""{{if eq .Item.Region ""}} selected{{end}}>{{t .Lang "f_region_auto"}}</option>
          <option value="US"{{if eq .Item.Region "US"}} selected{{end}}>{{t .Lang "f_region_us"}}</option>
          <option value="CA"{{if eq .Item.Region "CA"}} selected{{end}}>{{t .Lang "f_region_ca"}}</option>
        </select>
      </label>
      <label>{{t .Lang "f_status"}}
        <select name="status">
          <option value="active"{{if eq .Item.Status "active"}} selected{{end}}>{{t .Lang "f_status_active"}}</option>
          <option value="received"{{if eq .Item.Status "received"}} selected{{end}}>{{t .Lang "f_status_received"}}</option>
          <option value="owned"{{if eq .Item.Status "owned"}} selected{{end}}>{{t .Lang "f_status_owned"}}</option>
        </select>
      </label>
    </div>
    <label>{{t .Lang "f_notes"}}
      <textarea name="notes" rows="3" maxlength="1000">{{.Item.Notes}}</textarea>
      <small class="hint">{{t .Lang "f_notes_hint"}}</small>
    </label>
    <label class="check"><input type="checkbox" name="priority" value="1"{{if .Item.Priority}} checked{{end}}> {{t .Lang "f_priority"}}</label>
    <button class="btn primary">{{t .Lang "save"}}</button>
  </form>
</section>
<div class="actions">
  <form method="post" action="/admin/items/{{.Item.ID}}/refresh"><button class="btn">{{t .Lang "refresh_btn"}}</button></form>
  {{if and .ShowReservations .Reservations}}
  <form method="post" action="/admin/items/{{.Item.ID}}/release" data-confirm="{{t .Lang "release_confirm"}}"><button class="btn">{{tf .Lang "release_btn" .Reservations}}</button></form>
  {{end}}
  <form method="post" action="/admin/items/{{.Item.ID}}/delete" data-confirm="{{t .Lang "delete_confirm"}}"><button class="btn danger">{{t .Lang "delete_btn"}}</button></form>
</div>
{{end}}
