{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.PageTitle}}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#c2410c">
{{if not .Admin}}
<meta name="description" content="{{.Description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{.OGTitle}}">
<meta property="og:title" content="{{.OGTitle}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.Origin}}/">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{.Origin}}/static/og.png?v={{.Version}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{.OGTitle}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.OGTitle}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.Origin}}/static/og.png?v={{.Version}}">
{{end}}
<link rel="stylesheet" href="/static/style.css?v={{.Version}}">
<script src="/static/app.js?v={{.Version}}" defer></script>
</head>
<body{{if .Admin}} class="admin"{{end}}>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{if .Admin}}/admin{{else}}/{{end}}">🎁 {{.SiteTitle}}</a>
    {{if not .NoNav}}<nav>
      {{if .Admin}}
        <a href="/admin">Подарки</a>
        <a href="/admin/settings">Настройки</a>
        <a href="/" target="_blank">Сайт ↗</a>
        <form method="post" action="/admin/logout" class="inline"><button class="link">Выйти</button></form>
      {{else}}
        <a href="/lang/{{if eq .Lang "ru"}}en{{else}}ru{{end}}?next={{.Path}}">{{t .Lang "lang_switch"}}</a>
      {{end}}
    </nav>{{end}}
  </div>
</header>
<main class="wrap">
  {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
{{end}}
